<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Lumid HQ — the founder command center. Capture ideas by voice or text, plan your day, track deadlines, goals and KPIs, and save reels and videos into collections.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lumid HQ — the founder command center">
  <meta property="og:description" content="Capture ideas by voice or text, plan your day, track deadlines, goals and KPIs, and keep every reel and video you learn from in one place. Free early access.">
  <meta property="og:site_name" content="Lumid">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Lumid HQ — the founder command center">
  <meta name="twitter:description" content="Ideas, tasks, daily plans, deadlines and saved videos for founders — in one fast, private app. Free early access.">
  <title>Lumid HQ — the founder command center</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img src="icon.svg" alt="" width="36" height="36">
        <div><strong>Lumid HQ</strong><small>by Lumid</small></div>
      </div>
      <nav id="side-nav"></nav>
      <button class="btn ghost side-search" data-action="search">
        <span data-icon="search"></span> Search <kbd>⌘K</kbd>
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-row">
          <h1 id="view-title">Today</h1>
          <div class="topbar-actions">
            <button class="sync-badge" id="sync-badge" data-nav="settings" hidden><i></i><span></span></button>
            <button class="icon-btn" data-action="search" aria-label="Search"><span data-icon="search"></span></button>
            <button class="icon-btn" data-action="theme" aria-label="Toggle theme"><span data-icon="contrast"></span></button>
          </div>
        </div>
        <div class="chips" id="venture-filter" role="tablist" aria-label="Filter by venture"></div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <div id="auth" class="auth" hidden></div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
  <button class="fab" data-action="fab" aria-label="Add new"><span data-icon="plus"></span></button>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
